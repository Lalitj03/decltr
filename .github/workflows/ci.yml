name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Check every script parses
        run: for f in extension/*.js extension/lib/*.js extension/lib/ai/*.js server/bin/*.js server/src/*.js scripts/*.mjs; do node --check "$f"; done
      - name: Build the store package
        run: npm run package
