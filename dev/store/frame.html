<!doctype html>
<!-- Store graphics. Served by `npm run dev:ui`:
       http://localhost:5173/dev/store/frame.html?n=1   (1280x800 screenshots, n = 1, 2 or 3)
       http://localhost:5173/dev/store/frame.html?promo (440x280 promo tile)
     The panel images come from screenshots of the dev preview (dev/store/panel-N.png, 440x800). -->
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1b1b2f; }
  .shot { width: 1280px; height: 800px; display: flex; align-items: center; gap: 72px; padding: 0 96px;
    background: radial-gradient(circle at 15% 20%, #eef0ff, transparent 55%), linear-gradient(135deg, #f7f7fb, #f3ecff); overflow: hidden; }
  .copy { flex: 1; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 22px; margin-bottom: 40px; }
  .brand img { width: 40px; height: 40px; }
  h1 { font-size: 52px; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 24px; }
  h1 span { background: linear-gradient(90deg, #6366f1, #a855f7); -webkit-background-clip: text; color: transparent; }
  p { font-size: 22px; line-height: 1.5; color: #4b4b66; max-width: 560px; }
  .panel { width: 440px; height: 720px; border-radius: 18px; overflow: hidden; flex: none;
    box-shadow: 0 2px 6px rgb(20 20 50 / 8%), 0 24px 60px rgb(60 40 140 / 18%); background: #f7f7fb; }
  .panel img { width: 440px; display: block; }
  .promo { width: 440px; height: 280px; display: flex; flex-direction: column; justify-content: center; padding: 0 36px;
    background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; }
  .promo .brand { margin: 0 0 18px; font-size: 34px; }
  .promo .brand img { width: 52px; height: 52px; background: #fff; border-radius: 12px; padding: 6px; }
  .promo p { color: #fff; font-size: 21px; line-height: 1.35; }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const icon = '/extension/icons/icon128.png';
  const shots = {
    1: ['Tidy your tabs <span>in plain English</span>', 'Say what you want. Decltr shows a plan you can check and adjust, applies it, and can undo it.'],
    2: ['Save a window, <span>open it later</span>', 'Sessions keep tabs, groups and their names. Clear a window, then bring it back in any window.'],
    3: ['Your choice <span>of AI</span>', 'Google Gemini with your own key, Ollama on your own computer, or any OpenAI-compatible service. Nothing hosted, no account.'],
  };
  if (q.has('promo')) {
    document.body.innerHTML = `<div class="promo"><div class="brand"><img src="${icon}" alt="">Decltr</div><p>Tidy your Chrome tabs<br>in plain English.</p></div>`;
  } else {
    const n = Number(q.get('n') ?? 1);
    const [title, text] = shots[n];
    document.body.innerHTML = `<div class="shot"><div class="copy"><div class="brand"><img src="${icon}" alt="">Decltr</div><h1>${title}</h1><p>${text}</p></div>
      <div class="panel"><img src="/dev/store/panel-${n}.png" alt=""></div></div>`;
  }
</script>
</body>
</html>
